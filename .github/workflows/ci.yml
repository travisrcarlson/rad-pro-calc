name: CI Verification & Build

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Strict TypeScript check (app)
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: Strict TypeScript check (node config)
        run: npx tsc -p tsconfig.node.json --noEmit

      - name: ESLint zero-warning check
        run: npm run lint

      - name: Run 70/70 V&V physics benchmark suite
        run: npm test

      - name: Build production PWA bundle
        run: npm run build
